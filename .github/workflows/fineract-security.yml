# ============================================================================
# P2.4 - Security DAST Scan (OWASP ZAP)
# SoW 4.0 - Proyecto 2 - Fineract Pruebas y Calidad (Dev)
#
# Disparador: PR contra main (GitHub Flow) + workflow_dispatch
# Bloqueante: si - falla PR si Critical/High en ZAP
#
# Flujo:
#   1. Levantar Postgres + Fineract con docker-compose
#   2. Health check hasta que Fineract responda
#   3. Abrir Cloudflare Quick Tunnel -> URL efimera publica
#   4. OWASP ZAP Baseline + API scan contra la URL
#   5. Upload de reportes como artifact
#   6. Cleanup
#
# Migracion futura: cuando exista Aikido DAST configurado,
# reemplazar el step de ZAP por Aikido DAST API call.
# ============================================================================
name: "P2.4 - Fineract Security DAST"

on:
    pull_request:
        branches: [main]
        paths:
            - 'fineract-provider/**'
            - 'fineract-core/**'
            - 'fineract-loan/**'
            - 'fineract-savings/**'
            - 'build.gradle'
            - '**/build.gradle'
            - '.github/workflows/fineract-security.yml'
    workflow_dispatch:

permissions:
    contents: read
    checks: write
    pull-requests: write

concurrency:
    group: p2-4-${{ github.head_ref || github.ref_name }}
    cancel-in-progress: true

jobs:
    dast-scan:
        name: "OWASP ZAP DAST via Cloudflare Tunnel"
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Levantar PostgreSQL + Fineract con docker compose
              run: |
                  cat > docker-compose.yml <<EOF
                  services:
                    db:
                      image: postgres:16-alpine
                      environment:
                        POSTGRES_USER: postgres
                        POSTGRES_PASSWORD: postgres
                      ports:
                        - "5432:5432"
                      healthcheck:
                        test: ["CMD-SHELL", "pg_isready -U postgres"]
                        interval: 5s
                        timeout: 3s
                        retries: 20

                    fineract:
                      image: apache/fineract:latest
                      depends_on:
                        db:
                          condition: service_healthy
                      environment:
                        FINERACT_DEFAULT_TENANTDB_HOSTNAME: db
                        FINERACT_DEFAULT_TENANTDB_PORT: 5432
                        FINERACT_DEFAULT_TENANTDB_UID: postgres
                        FINERACT_DEFAULT_TENANTDB_PWD: postgres
                        FINERACT_TENANTS_DRIVER: org.postgresql.Driver
                        FINERACT_TENANTS_URL: jdbc:postgresql://db:5432/fineract_tenants
                        FINERACT_TENANTS_UID: postgres
                        FINERACT_TENANTS_PWD: postgres
                        FINERACT_HIKARI_DRIVER_SOURCE_CLASS_NAME: org.postgresql.Driver
                        FINERACT_HIKARI_JDBC_URL: jdbc:postgresql://db:5432/fineract_tenants
                        FINERACT_HIKARI_USERNAME: postgres
                        FINERACT_HIKARI_PASSWORD: postgres
                        FINERACT_SERVER_SSL_ENABLED: false
                        FINERACT_SERVER_PORT: 8080
                      ports:
                        - "8080:8080"
                  EOF

                  docker compose up -d
                  echo "docker compose levantado"

            - name: Esperar a que Fineract responda
              run: |
                  echo "Esperando Fineract en http://localhost:8080..."
                  for i in $(seq 1 60); do
                      if curl -sf http://localhost:8080/fineract-provider/actuator/health > /dev/null 2>&1; then
                          echo "Fineract listo en intento $i ($((i*5)) segundos)"
                          exit 0
                      fi
                      echo "  Intento $i / 60..."
                      sleep 5
                  done
                  echo "ERROR: Fineract no respondio en 5 minutos"
                  docker compose logs fineract | tail -50
                  exit 1

            - name: Instalar cloudflared
              run: |
                  curl -sSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
                  sudo dpkg -i cloudflared.deb
                  cloudflared --version

            - name: Iniciar Cloudflare Quick Tunnel
              id: tunnel
              run: |
                  # Arrancar tunnel en background, guardar output para extraer URL
                  cloudflared tunnel --url http://localhost:8080 --no-autoupdate > tunnel.log 2>&1 &
                  TUNNEL_PID=$!
                  echo "TUNNEL_PID=$TUNNEL_PID" >> $GITHUB_ENV

                  # Esperar a que aparezca la URL en el log (max 60s)
                  echo "Esperando URL del tunnel..."
                  for i in $(seq 1 30); do
                      URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | head -1)
                      if [ -n "$URL" ]; then
                          echo "Tunnel URL: $URL"
                          echo "tunnel_url=$URL" >> $GITHUB_OUTPUT
                          exit 0
                      fi
                      sleep 2
                  done
                  echo "ERROR: No se pudo obtener URL del tunnel"
                  cat tunnel.log
                  exit 1

            - name: Verificar que ZAP puede alcanzar Fineract via tunnel
              run: |
                  URL="${{ steps.tunnel.outputs.tunnel_url }}"
                  echo "Verificando acceso a $URL/fineract-provider/actuator/health"
                  # Esperar propagacion del tunnel
                  sleep 10
                  curl -sf "$URL/fineract-provider/actuator/health" || {
                      echo "ERROR: No se puede acceder via tunnel"
                      exit 1
                  }
                  echo "OK - Fineract accesible via tunnel"

            - name: OWASP ZAP Baseline Scan
              uses: zaproxy/action-baseline@v0.13.0
              with:
                  target: ${{ steps.tunnel.outputs.tunnel_url }}/fineract-provider/
                  cmd_options: '-a -j -T 5'
                  fail_action: true
                  allow_issue_writing: false
                  artifact_name: 'zap-baseline-report'

            - name: Cleanup - matar tunnel
              if: always()
              run: |
                  if [ -n "$TUNNEL_PID" ]; then
                      kill $TUNNEL_PID 2>/dev/null || true
                      echo "Tunnel cerrado"
                  fi

            - name: Cleanup - docker compose down
              if: always()
              run: |
                  docker compose logs fineract | tail -100 > fineract-logs.txt
                  docker compose down -v
                  echo "docker compose destruido"

            - name: Upload Fineract logs (para debugging)
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: fineract-logs-p2-4
                  path: fineract-logs.txt
                  retention-days: 7
